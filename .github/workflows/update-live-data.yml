name: Dashboard Alerts — IMD Stations (Hourly)

on:
  # schedule: disabled, see note below
    # Run every hour
# DISABLED 2026-10-14. Nothing on the site reads the IMD station scrape any
# more: Current Alerts, Historical Zones and the live map all run on the
# Open-Meteo grid. The scrape only fed weather_logs/india_weather_*.csv (75
# weekly files, the evidence base for the IMD-gap analysis), which stays in the
# repo and stops growing from this date. Re-enable by uncommenting the cron.
#    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas beautifulsoup4 tabulate

      - name: Run IMDdata.py
        run: |
          cd ${{ github.workspace }}
          python scripts/IMDdata.py

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update live map data [automated]" && git pull --rebase && git push)
